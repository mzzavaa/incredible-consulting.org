# Per-site identity. The theme reads only these keys, so nothing in
# themes/incredible is hardcoded to one domain.

sublabel: "Open"
# The theme uses this key for the nav and closing button. On this site the
# button leads to the talks, not to a sales call: nothing is sold here.
booking_url: "/talks/"
strapline: "Talks, slides and method, published openly and free to reuse."
cta_line_1: "Take the slides."
cta_line_2: "Use it without asking."
primary_cta: "See every talk"

# Only domains that are live. Company, Builders, Community and Training come
# back when their sites are published. incredible.training still serves an old
# Netlify demo template, so it is not linked.
family:
  - { name: "Consulting", url: "https://incredible-consulting.com" }
  - { name: "Open",       url: "https://incredible-consulting.org" }
  - { name: "AI Solutions Wiki", url: "https://ai-solutions.wiki" }
  - { name: "Linda Mohamed", url: "https://lindamohamed.com" }
