baseURL = 'https://incredible-consulting.org/'
locale = 'en-us'
theme = "incredible"
title = 'Incredible Consulting · Open'
enableEmoji = false
disableHugoGeneratorInject = true
disableKinds = ['taxonomy', 'term']

# Brand palette (applied in a later theming pass):
#   green #3D8F37 · dark #0a1a08 · white #fff · bg #f8f9f6
# Typeface: Inter

[params]
  description  = "Every talk with its slides, and the courses, method and patterns in the AI Solutions Wiki. Free to read, use and share."
  tagline      = "Everything I publish, in the open."
  email        = "open@incredible-consulting.org"
  linkedin     = "https://www.linkedin.com/in/lindamohamed"
  github       = "https://github.com/linda-mhmd"
  parent       = "https://incredible-company.com/"
  license      = "CC BY 4.0"
  license_url  = "https://creativecommons.org/licenses/by/4.0/"
  code_license = "MIT"
  maintainer   = "Linda Mohamed · AWS Community Hero · Vienna, Austria"

  # Sibling domains in the portfolio
  consulting_com = "https://incredible-consulting.com/"
  # The unhyphenated domain forwards here. The two link to each other.
  alias_domain   = "https://incredibleconsulting.org/"
  founder        = "https://lindamohamed.com/"
  wiki           = "https://ai-solutions.wiki/"
  builders       = "https://incredible.builders/"
  community      = "https://incredible.community/"
  training       = "https://incredible.training/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menus.main]]
  name = "Talks and Slides"
  url = "/talks/"
  weight = 10
[[menus.main]]
  name = "Wiki Material"
  url = "/wiki/"
  weight = 20

# The method, playbook, checklist, architecture, research and programme
# sections are specified as briefs and set to draft until they are written.
# Add their menu entries back when the pages carry real copy.
